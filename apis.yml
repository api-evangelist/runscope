aid: runscope
name: Runscope
description: >-
  Runscope is an API monitoring and testing platform that lets teams create,
  schedule, and run automated tests against their APIs to catch performance
  problems, uptime issues, and functional regressions before customers do.
  Originally an independent, a16z-backed startup, Runscope was acquired by CA
  Technologies in 2017 and is now delivered as the API Monitoring capability of
  BlazeMeter (a Perforce company). The product exposes a REST API for managing
  buckets, tests, environments, and test results, along with scheduled runs,
  integrations, and real-user Radar monitoring.
